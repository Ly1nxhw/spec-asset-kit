schema_version: "1.0"

extension:
  id: ai-assets
  name: "AI Assets Extractor"
  version: "1.0.0"
  description: "Extracts business private knowledge into ai-assets/ and injects those assets into planning."
  author: spec-kit-core
  repository: https://github.com/Ly1nxhw/spec-asset-kit
  license: MIT

requires:
  speckit_version: ">=0.2.0.dev0"
  tools:
    - name: python
      required: false

provides:
  commands:
    - name: speckit.ai-assets.extract
      aliases:
        - speckit.assets.extract
      file: commands/speckit.ai-assets.extract.md
      description: "Initialize or refresh ai-assets/ from business and repository facts."
    - name: speckit.ai-assets.refine
      aliases:
        - speckit.assets.refine
      file: commands/speckit.ai-assets.refine.md
      description: "Promote candidate business knowledge using human answers."
    - name: speckit.ai-assets.check
      aliases:
        - speckit.assets.check
      file: commands/speckit.ai-assets.check.md
      description: "只读检查 ai-assets 漂移、过期锚点和规划误用。"
    - name: speckit.ai-assets.reconcile
      aliases:
        - speckit.assets.reconcile
      file: commands/speckit.ai-assets.reconcile.md
      description: "实现后对齐 ai-assets，并保留人工确认边界。"

hooks:
  before_plan:
    command: speckit.ai-assets.extract
    optional: false
    description: "Refresh business knowledge assets before implementation planning."

tags:
  - "ai-assets"
  - "documentation"
  - "planning"
  - "core"
