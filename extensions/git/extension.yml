schema_version: "1.0"

extension:
  id: git
  name: "Git Branching Workflow"
  version: "1.0.0"
  description: "Feature branch creation, numbering (sequential/timestamp), validation, and Git remote detection"
  author: spec-kit-core
  repository: https://github.com/Ly1nxhw/spec-asset-kit
  license: MIT

requires:
  speckit_version: ">=0.2.0"
  tools:
    - name: git
      required: false

provides:
  commands:
    - name: speckit.git.feature
      file: commands/speckit.git.feature.md
      description: "Create a feature branch with sequential or timestamp numbering"
    - name: speckit.git.validate
      file: commands/speckit.git.validate.md
      description: "Validate current branch follows feature branch naming conventions"
    - name: speckit.git.remote
      file: commands/speckit.git.remote.md
      description: "Detect Git remote URL for GitHub integration"
    - name: speckit.git.initialize
      file: commands/speckit.git.initialize.md
      description: "Initialize a Git repository with an initial commit"
    - name: speckit.git.commit
      file: commands/speckit.git.commit.md
      description: "Auto-commit changes after a Spec Kit command completes"

  config:
    - name: "git-config.yml"
      template: "config-template.yml"
      description: "Git branching configuration"
      required: false

hooks:
  before_constitution:
    command: speckit.git.initialize
    optional: false
    description: "在宪章设置前初始化 Git 仓库"
  before_specify:
    command: speckit.git.feature
    optional: false
    description: "在编写规格前创建功能分支"
  before_clarify:
    command: speckit.git.commit
    optional: true
    prompt: "是否在澄清前提交未提交变更？"
    description: "在规格澄清前自动提交"
  before_plan:
    command: speckit.git.commit
    optional: true
    prompt: "是否在规划前提交未提交变更？"
    description: "在实现规划前自动提交"
  before_tasks:
    command: speckit.git.commit
    optional: true
    prompt: "是否在生成任务前提交未提交变更？"
    description: "在生成任务前自动提交"
  before_implement:
    command: speckit.git.commit
    optional: true
    prompt: "是否在实现前提交未提交变更？"
    description: "在实现前自动提交"
  before_checklist:
    command: speckit.git.commit
    optional: true
    prompt: "是否在生成检查清单前提交未提交变更？"
    description: "在生成检查清单前自动提交"
  before_analyze:
    command: speckit.git.commit
    optional: true
    prompt: "是否在分析前提交未提交变更？"
    description: "在分析前自动提交"
  before_taskstoissues:
    command: speckit.git.commit
    optional: true
    prompt: "是否在同步 issue 前提交未提交变更？"
    description: "在任务转 issue 前自动提交"
  after_constitution:
    command: speckit.git.commit
    optional: true
    prompt: "是否提交宪章变更？"
    description: "在宪章更新后自动提交"
  after_specify:
    command: speckit.git.commit
    optional: true
    prompt: "是否提交规格变更？"
    description: "在规格生成后自动提交"
  after_clarify:
    command: speckit.git.commit
    optional: true
    prompt: "是否提交澄清变更？"
    description: "在规格澄清后自动提交"
  after_plan:
    command: speckit.git.commit
    optional: true
    prompt: "是否提交计划变更？"
    description: "在实现规划后自动提交"
  after_tasks:
    command: speckit.git.commit
    optional: true
    prompt: "是否提交任务变更？"
    description: "在任务生成后自动提交"
  after_implement:
    command: speckit.git.commit
    optional: true
    prompt: "是否提交实现变更？"
    description: "在实现后自动提交"
  after_checklist:
    command: speckit.git.commit
    optional: true
    prompt: "是否提交检查清单变更？"
    description: "在检查清单生成后自动提交"
  after_analyze:
    command: speckit.git.commit
    optional: true
    prompt: "是否提交分析结果？"
    description: "在分析后自动提交"
  after_taskstoissues:
    command: speckit.git.commit
    optional: true
    prompt: "是否在同步 issue 后提交？"
    description: "在任务转 issue 后自动提交"

tags:
  - "git"
  - "branching"
  - "workflow"

config:
  defaults:
    branch_numbering: sequential
    init_commit_message: "[Spec Kit] Initial commit"
